<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tugas 2 - Data Pegawai</title>
  <style>
    table { border-collapse: collapse; }
    th, td { border: 1px solid #000; padding: 6px 10px; text-align: left; }
  </style>
</head>
<body>
  <h1>Data Pegawai</h1>

  <table>
    <thead>
      <tr>
        <th>Nama Pegawai</th>
        <th>Umur</th>
        <th>Jabatan</th>
        <th>Status</th>
        <th>Gaji Pokok</th>
        <th>Tunjangan Jabatan</th>
        <th>BPJS</th>
        <th>Tunjangan Keluarga</th>
        <th>Total Gaji</th>
      </tr>
    </thead>
    <tbody id="data-pegawai"></tbody>
    <tfoot id="total-gaji"></tfoot>
  </table>

  <script>
    // Data pegawai
    const nama = "Dodi Prayodi";
    const umur = 25;
    const jabatan = "Manajer";
    const status = "Menikah";

    // Gaji pokok ditentukan dengan if berdasarkan jabatan
    let gajiPokok;
    if (jabatan === "Manajer") {
      gajiPokok = 15000000;
    } else if (jabatan === "Asisten Manajer") {
      gajiPokok = 10000000;
    } else if (jabatan === "Staff") {
      gajiPokok = 5000000;
    } else {
      gajiPokok = 0;
    }

    // Tunjangan jabatan 15% dan BPJS 10% dari gaji pokok
    const tunjanganJabatan = gajiPokok * 15 / 100;
    const bpjs = gajiPokok * 10 / 100;

    // Tunjangan keluarga ditentukan dengan ternary berdasarkan status
    const tunjanganKeluarga = status === "Menikah" ? gajiPokok * 20 / 100 : 0;

    // Total gaji adalah jumlah seluruh komponen gaji
    const totalGaji = gajiPokok + tunjanganJabatan + bpjs + tunjanganKeluarga;

    // Mengubah angka menjadi format rupiah, contoh: 15000000 -> Rp 15.000.000
    const rupiah = (angka) => "Rp " + angka.toLocaleString("id-ID");

    // Mengisi baris data pegawai ke dalam tbody
    document.getElementById("data-pegawai").innerHTML =
      "<tr>" +
        "<td>" + nama + "</td>" +
        "<td>" + umur + " tahun</td>" +
        "<td>" + jabatan + "</td>" +
        "<td>" + status + "</td>" +
        "<td>" + rupiah(gajiPokok) + "</td>" +
        "<td>" + rupiah(tunjanganJabatan) + "</td>" +
        "<td>" + rupiah(bpjs) + "</td>" +
        "<td>" + rupiah(tunjanganKeluarga) + "</td>" +
        "<td>" + rupiah(totalGaji) + "</td>" +
      "</tr>";

    // Mengisi total gaji ke dalam tfoot
    document.getElementById("total-gaji").innerHTML =
      "<tr><td colspan='8'>Total Gaji</td><td>" + rupiah(totalGaji) + "</td></tr>";
  </script>
</body>
</html>
