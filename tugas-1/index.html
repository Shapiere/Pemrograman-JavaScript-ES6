<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Tugas 1 - Menghitung Luas Bangun Datar</title>
</head>
<body>
  <h1>Tugas 1 - Menghitung Luas Bangun Datar</h1>
  <p id="hasil"></p>

  <script>
    // Menghitung luas persegi panjang dari panjang dan lebar.
    function hitungLuasPersegiPanjang(panjang, lebar) {
      let luas = panjang * lebar;
      return luas;
    }

    // Menghitung luas bujur sangkar dari panjang sisinya.
    function hitungLuasBujurSangkar(sisi) {
      let luas = sisi * sisi;
      return luas;
    }

    // Menghitung luas segitiga dari alas dan tinggi.
    function hitungLuasSegitiga(alas, tinggi) {
      let luas = (alas * tinggi) / 2;
      return luas;
    }

    // Nilai parameter bebas, silakan diubah sesuai kebutuhan.
    const panjang = 8;
    const lebar = 5;
    const sisi = 6;
    const alas = 10;
    const tinggi = 4;

    // Memanggil ketiga fungsi di atas.
    const luasPersegiPanjang = hitungLuasPersegiPanjang(panjang, lebar);
    const luasBujurSangkar = hitungLuasBujurSangkar(sisi);
    const luasSegitiga = hitungLuasSegitiga(alas, tinggi);

    // Menampilkan hasil perhitungan di halaman.
    document.getElementById("hasil").innerHTML =
      "Luas persegi panjang = " + luasPersegiPanjang + "<br>" +
      "Luas bujur sangkar = " + luasBujurSangkar + "<br>" +
      "Luas segitiga = " + luasSegitiga;
  </script>
</body>
</html>
